# URL of the kChat server to connect to.
# This can be overridden per-user in the login flow.
server_url: ""

# Displayname template for kChat users.
# Available variables: .Username, .Nickname, .FirstName, .LastName
displayname_template: "{{if .Nickname}}{{.Nickname}}{{else}}{{.Username}}{{end}} (kChat)"

# Username prefix for echo prevention. Any kChat username starting with
# this prefix is treated as a bridge-managed bot and its posts will not be
# relayed back to Matrix. Leave empty to disable prefix-based filtering.
bot_prefix: ""

# Listen address for the admin HTTP API (serves /api/reload-puppets).
# Set to "" to disable the admin API (recommended for single-user setups);
# "-" falls back to BRIDGE_API_ADDR, then the default port 29320.
admin_api_addr: ""

# Enable message backfill to populate channel history on first sync.
backfill_enabled: false

# Maximum number of messages to backfill per channel.
backfill_max_count: 100

# Typing indicator timeout in seconds.
typing_timeout: 5

# Seconds between channel post polls (kChat broadcasts posts unreliably).
# 0 disables polling — including read receipts and relay invites.
poll_interval: 5

# Matrix user IDs to invite into all shared portal rooms (team deployments
# with split_portals: false).
relay_invite_users: []
