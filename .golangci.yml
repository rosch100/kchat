version: "2"

linters:
  default: standard
  enable:
    - gosec
    - misspell
    - ineffassign
  settings:
    errcheck:
      exclude-functions:
        # Best-effort teardown paths where an error cannot be acted upon.
        - (*github.com/gorilla/websocket.Conn).Close
        - (*os.File).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
