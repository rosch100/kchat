name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }} binary
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: matrix.goos == 'linux'
        uses: docker/setup-buildx-action@v3

      - name: Build in container (bundles libolm)
        if: matrix.goos == 'linux'
        run: |
          docker buildx build --platform linux/${{ matrix.goarch }} \
            --target binary \
            --output type=local,dest=/tmp/out \
            .
          cp /tmp/out/matrix-kchat matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Checksums
        run: |
          for f in matrix-kchat-*; do sha256sum "$f" >> checksums.txt; done
          cat checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            matrix-kchat-*
            checksums.txt
          generate_release_notes: true
