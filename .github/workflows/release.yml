name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build ${{ matrix.arch }} binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build in container (includes libolm)
        run: |
          docker buildx build --platform linux/amd64 \
            --target binary \
            --output type=local,dest=/tmp/out \
            . || true
          # Fallback: cross-compile without E2EE for non-linux targets
          if [ -f /tmp/out/matrix-kchat ] && [ "${{ matrix.goos }}" = "linux" ]; then
            cp /tmp/out/matrix-kchat matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}
          else
            CGO_ENABLED=0 go build -ldflags "-s -w \
              -X main.Tag=${{ github.ref_name }} \
              -X main.Commit=${{ github.sha }}" \
              -o matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/matrix-kchat
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -e
          for f in matrix-kchat-*; do sha256sum "$f" >> checksums.txt; done
          curl -sf "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases" \
            -H "Authorization: token $GITEA_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"${GITHUB_REF_NAME}\",\"draft\":false,\"prerelease\":false}" > /tmp/release.json
          RELEASE_ID=$(jq -r '.id' /tmp/release.json)
          for f in matrix-kchat-* checksums.txt; do
            URL="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$f"
            curl -sf "$URL" -H "Authorization: token $GITEA_TOKEN" -F "attachment=@$f"
          done
