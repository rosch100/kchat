name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }} binary
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: darwin
            goarch: amd64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: matrix.goos == 'linux'
        uses: docker/setup-buildx-action@v3

      - name: Build in container (bundles libolm)
        if: matrix.goos == 'linux'
        run: |
          docker buildx build --platform linux/${{ matrix.goarch }} \
            --target binary \
            --output type=local,dest=/tmp/out \
            .
          cp /tmp/out/matrix-kchat matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Build natively with libolm (macOS, CGO required for E2EE + sqlite)
        if: matrix.goos == 'darwin'
        run: |
          git clone --depth 1 https://gitlab.matrix.org/matrix-org/olm.git /tmp/olm
          # Upstream bug: clang rejects the const-pointer increment in list.hh.
          sed -i '' 's/T \* const other_pos = other._data;/T * other_pos = other._data;/' /tmp/olm/include/olm/list.hh || \
            sed -i 's/T \* const other_pos = other._data;/T * other_pos = other._data;/' /tmp/olm/include/olm/list.hh
          cmake -S /tmp/olm -B /tmp/olm/build -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/olm/build --parallel
          cmake --install /tmp/olm/build --prefix /usr/local
          CGO_CFLAGS='-I/usr/local/include' CGO_LDFLAGS='-L/usr/local/lib' \
            go build -ldflags "-s -w \
            -X main.Tag=${{ github.ref_name }} \
            -X main.Commit=${{ github.sha }}" \
            -o matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/matrix-kchat

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Checksums
        run: |
          for f in matrix-kchat-*; do sha256sum "$f" >> checksums.txt; done
          cat checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            matrix-kchat-*
            checksums.txt
          generate_release_notes: true
