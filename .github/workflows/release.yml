name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rosch100/kchat

jobs:
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }} binary
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build in container (bundles libolm)
        run: |
          docker buildx build --platform linux/${{ matrix.goarch }} \
            --target binary \
            --output type=local,dest=/tmp/out \
            .
          cp /tmp/out/matrix-kchat matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: matrix-kchat-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create GitHub release
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: matrix-kchat-*
          merge-multiple: true

      - name: Checksums
        run: |
          for f in matrix-kchat-*; do sha256sum "$f" >> checksums.txt; done
          cat checksums.txt

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            matrix-kchat-*
            checksums.txt
          generate_release_notes: true

  docker:
    name: Docker image (${{ matrix.goarch }})
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.goarch }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" | tr -d '[:space:]' > "/tmp/digests/${{ matrix.goarch }}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.goarch }}
          path: /tmp/digests/*
          if-no-files-found: error

  docker-merge:
    name: Merge Docker manifest
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          DIGESTS=()
          for f in *; do
            D=$(tr -d '[:space:]' < "$f")
            D="${D#sha256:}"
            DIGESTS+=("$REF@sha256:$D")
          done
          echo "manifest sources:${DIGESTS[*]}"
          VERSION="${{ github.ref_name }}"
          MINOR=$(echo "$VERSION" | sed -n "s/^v\\([0-9]*\\.[0-9]*\\)\\..*/\\1/p")
          docker manifest create "$REF:$VERSION" "${DIGESTS[@]}"
          docker manifest create "$REF:$MINOR" "${DIGESTS[@]}"
          docker manifest create "$REF:latest" "${DIGESTS[@]}"
          docker manifest push "$REF:$VERSION"
          docker manifest push "$REF:$MINOR"
          docker manifest push "$REF:latest"

      - name: Inspect image
        run: |
          VERSION="${{ github.ref_name }}"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION"
