name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install olm
        run: sudo apt-get update && sudo apt-get install -y libolm-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
